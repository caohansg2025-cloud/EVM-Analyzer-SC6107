[project]
name = "evm-analyzer-security-scan"
version = "0.1.0"
description = "Security analysis module for the EVM Transaction Debugger & Analyzer (SC6107)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junzhee" }]
dependencies = [
    "fastapi>=0.136.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "slither-analyzer>=0.10.0",
    "solc-select>=1.0.4",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
